<div id="column-a3c33c0c-9184-4f2d-b862-665067b24100" class="flex w-full flex-col ">
  <div id="row_29" class="flex gap-4 w-full flex-row place-items-center border-b-2 py-2 px-4 mb-4">
    <div class="flex w-full">
      <cl-icon id="editIcon" [properties]="editIconProperties">
      </cl-icon>
      <cl-label id="popupTitle" [properties]="popupTitleProperties">
      </cl-label>
    </div>
    <cl-icon id="icon8" [properties]="icon8Properties">
    </cl-icon>
  </div>
  <form clValidationForm id="form_26" #form26="ngForm" [suite]="form_26Suite" class="grid w-full gap-4 px-4 grid-cols-1"
    [formValue]="form_26FormValue()" (validChange)="form_26FormValid.set($event)"
    (errorsChange)="form_26Errors.set($event)" (formValueChange)="setform_26FormValue($event)">
    <cl-input id="input3" name="input3" [properties]="input3Properties" [ngModel]="form_26Vm.formValue.input3">
    </cl-input>

    <div id="column-03" class="flex w-full flex-col ">
      <cl-select d="select1" name="select1" [properties]="select1Properties" [ngModel]="form_26Vm.formValue.select1">
      </cl-select>

      @if(updateOrchestrationDetailsPopupService.selectedOrchestrationTemplate){
      <div id="templateTypeLabelRow" class="flex w-full flex-row ">
        <cl-label id="templateTypeLabel" [properties]="updateOrchestrationDetailsPopupService.templateTypeLabelProperties">
        </cl-label>
        <cl-label id="templateTypeValue"
          [properties]="updateOrchestrationDetailsPopupService.getTemplateTypeValueProperties(updateOrchestrationDetailsPopupService.selectedOrchestrationTemplate?.type)">
        </cl-label>
      </div>
      }
    </div>
    @if(updateOrchestrationDetailsPopupService.selectedOrchestrationTemplate
    &&updateOrchestrationDetailsPopupService.selectedOrchestrationTemplate?.type === 'Online' )
    {
    <cl-input id="noOfInstance" name="noOfInstance"
      [properties]="updateOrchestrationDetailsPopupService.NoOfInstaceProperties"
      [ngModel]="form_26Vm.formValue.noOfInstance">
    </cl-input>
    }
    <cl-input id="product_code" name="product_code" [properties]="updateOrchestrationDetailsPopupService.productCodeProperties"
      [ngModel]="form_26Vm.formValue.product_code">
    </cl-input>
    <cl-input id="process_code" name="process_code" [properties]="updateOrchestrationDetailsPopupService.processCodeProperties"
      [ngModel]="form_26Vm.formValue.process_code">
    </cl-input>

  </form>
  <div id="row_28" class="flex w-full flex-row justify-end bg-neutral-100 mt-2 py-4 px-4">
    <cl-button id="update" [properties]="updateProperties">
    </cl-button>
  </div>
</div>
